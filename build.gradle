plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${fabric_loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    // e4mc is only needed at compile time; Simple Voice Chat is reached through its API and a mixin by name
    modCompileOnly fileTree(dir: 'libs', include: 'e4mc-*.jar')

    testImplementation "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', project.minecraft_dependency
    inputs.property 'fabric_loader_version', project.fabric_loader_version
    inputs.property 'voicechat_min_version', project.voicechat_min_version
    inputs.property 'java_version', project.java_version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_dependency': project.minecraft_dependency,
                'voicechat_min_version': project.voicechat_min_version,
                'java_version': project.java_version,
                'fabric_loader_version': project.fabric_loader_version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
